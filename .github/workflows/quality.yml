name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gamo_test
          POSTGRES_PASSWORD: gamo_test
          POSTGRES_DB: gamo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamo_test -d gamo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py db_migrations.py desktop.py updater.py
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Run SQLite smoke tests
        run: python tests/smoke_app.py
      - name: Run PostgreSQL smoke tests
        env:
          DATABASE_URL: postgresql://gamo_test:gamo_test@127.0.0.1:5432/gamo_test
        run: python tests/smoke_app.py
