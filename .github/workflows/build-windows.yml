name: Build and release GAMO FM for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build desktop application
        run: pyinstaller --noconfirm --clean --windowed --name GAMO_FM --add-data "templates;templates" --add-data "static;static" --add-data "version.json;." --add-data "update_config.json;." desktop.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\GAMO_FM.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: GAMO-FM-Windows-Installer
          path: dist_installer/*.exe

      - name: Publish GitHub Release and update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $installer = Get-ChildItem dist_installer\*.exe | Select-Object -First 1
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          gh release create "${{ github.ref_name }}" $installer.FullName --title "GAMO FM $version" --notes "Automatické vydanie GAMO FM $version"
          $download = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
          $manifest = @{
            version = $version
            installer_url = $download
            sha256 = $sha
            notes = "GAMO FM $version – automatická aktualizácia"
          } | ConvertTo-Json
          git fetch origin main
          git checkout main
          $manifest | Set-Content -Path update.json -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update manifest for $version"
          git push origin main
