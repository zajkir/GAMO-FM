name: Build and release GAMO FM for Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'launcher.py'
      - 'desktop.py'
      - 'updater.py'
      - 'desktop_config.json'
      - 'update_config.json'
      - 'version.json'
      - 'installer/**'
      - 'tests/launcher_ui_static.py'
      - 'tests/desktop_window_static.py'
      - 'tests/installer_regression.py'
      - 'tests/release_workflow_static.py'
      - 'tests/update_flow_regression.py'
      - '.github/workflows/build-windows.yml'
  push:
    branches:
      - main
    paths:
      - 'launcher.py'
      - 'desktop.py'
      - 'updater.py'
      - 'desktop_config.json'
      - 'update_config.json'
      - 'version.json'
      - 'installer/**'
      - 'tests/launcher_ui_static.py'
      - 'tests/desktop_window_static.py'
      - 'tests/installer_regression.py'
      - 'tests/release_workflow_static.py'
      - 'tests/update_flow_regression.py'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: gamo-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Validate launcher and installer regression
        run: |
          python -m py_compile launcher.py updater.py desktop.py
          python tests/launcher_ui_static.py
          python tests/desktop_window_static.py
          python tests/installer_regression.py
          python tests/release_workflow_static.py
          python tests/update_flow_regression.py

      - name: Build GAMO single-process cloud client
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GAMO_Launcher --distpath dist_launcher --collect-all webview --add-data "version.json;." --add-data "update_config.json;." --add-data "desktop_config.json;." launcher.py

      - name: Prepare versioned launcher payload
        shell: pwsh
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          Copy-Item "dist_launcher\GAMO_Launcher.exe" "dist_launcher\GAMO_Launcher_$version.exe" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\GAMO_FM.iss

      - name: Validate installer output
        shell: powershell
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          $expected = "dist_installer\GAMO_FM_Setup_$version.exe"
          if (-not (Test-Path $expected)) {
            Write-Error "Expected installer was not created: $expected"
            exit 1
          }
          $size = (Get-Item $expected).Length
          if ($size -lt 1000000) {
            Write-Error "Installer is unexpectedly small: $size bytes"
            exit 1
          }
          Write-Host "Installer OK: $expected ($size bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: GAMO-FM-Windows-Release
          path: |
            dist_installer/*.exe
            dist_launcher/GAMO_Launcher_*.exe
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content version.json | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = Get-ChildItem dist_installer\GAMO_FM_Setup_$version.exe | Select-Object -First 1
          $launcher = Get-ChildItem dist_launcher\GAMO_Launcher_$version.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Installer for version $version was not found."
          }
          if (-not $launcher) {
            throw "Launcher payload for version $version was not found."
          }

          $notes = @"
          GAMO a.s. $version

          - Direct self-update of GAMO_Launcher.exe without PowerShell dependency
          - Automatic rollback copy and SHA-256 verification after replacement
          - Installer fallback for protected installation directories
          - Automatic launcher relaunch after successful update
          - Tenant-isolated cloud application with MFA, Privacy Center and ticket messaging
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName $launcher.FullName --clobber
          } else {
            gh release create $tag $installer.FullName $launcher.FullName --target "${{ github.sha }}" --title "GAMO a.s. $version" --notes $notes
          }

          $installerSha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $launcherSha = (Get-FileHash $launcher.FullName -Algorithm SHA256).Hash.ToLower()
          $installerDownload = "https://github.com/${{ github.repository }}/releases/download/$tag/$($installer.Name)"
          $launcherDownload = "https://github.com/${{ github.repository }}/releases/download/$tag/$($launcher.Name)"
          $manifest = [ordered]@{
            version = $version
            update_mode = "launcher"
            launcher_url = $launcherDownload
            launcher_sha256 = $launcherSha
            installer_url = $installerDownload
            sha256 = $installerSha
            notes = "GAMO a.s. $version - direct verified launcher self-update"
            published_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json

          $manifest | Set-Content -Path update.json -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json

          if (git diff --cached --quiet) {
            Write-Host "Update manifest is already current."
          } else {
            git commit -m "Publish update manifest for $version"
            git push origin HEAD:main
          }

      - name: Release summary
        shell: powershell
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          "### GAMO a.s. Windows $version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Installer fallback: GAMO_FM_Setup_$version.exe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Direct launcher payload: GAMO_Launcher_$version.exe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- SHA-256 hashes for both payloads are generated automatically on main." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
