<!doctype html>
<html lang="sk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{code}} · GAMO a.s.</title><link rel="stylesheet" href="/static/app.css?v={{app_version|default('')}}"></head>
<body class="error-page">
 <main class="error-card">
  <div class="error-brand"><span>G</span><div><b>GAMO a.s.</b><small>FACILITY PLATFORM</small></div></div>
  <div class="error-code">{{code}}</div>
  <h1>{{title}}</h1><p>{{message}}</p>
  <div class="error-actions"><button type="button" onclick="location.reload()">↻ Skúsiť znova</button><a href="/">Prejsť na prehľad</a></div>
  <small>Ak sa problém opakuje, podpora vie chybu dohľadať v serverovom logu bez zobrazenia citlivých dát.</small>
 </main>
</body></html>
